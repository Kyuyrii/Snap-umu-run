name: umu-run
base: core26
version: 1.4.4
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
summary: Unified launcher for Windows games on Linux
description: |
  This is a unified launcher for Windows games on Linux.
  It is essentially a copy of the Steam Runtime Tools and Steam Linux Runtime that Valve uses for Proton, with some modifications made so that it can be used outside of Steam.
grade: stable
confinement: strict
compression: lzo
icon: org.openwinecomponents.umu.umu-launcher.png

apps:
  umu-run:
    command-chain: [define-variables]
    command: usr/bin/umu-run
    desktop: umu-run.desktop
    common-id: org.openwinecomponents.umu.umu-launcher
    extensions: [gnome]
    environment:
      HOME: $SNAP_USER_COMMON
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages:$SNAP/gnome-platform/usr/lib/python3/dist-packages
      BWRAP: $SNAP/bin/bwrap
      PRESSURE_VESSEL_BWRAP: $SNAP/bin/bwrap
    plugs: &plugs
      - audio-playback
      - network
      - network-bind
      - screen-inhibit-control
      - home
      - removable-media
      - mount-observe
      - joystick
      - bluez
      - udisks2
      - system-observe
      - hardware-observe
      - upower-observe
      - umu-support
  uddc:
    command: usr/bin/uddc
    desktop: uddc.desktop
    extensions: [gnome]
    environment:
      HOME: $SNAP_USER_DATA
    plugs: *plugs

plugs:
  shared-memory:
    private: true

layout:
  /usr/bin/python3:
    symlink: $SNAP/gnome-platform/usr/bin/python3

parts:
  umu-run-app:
    plugin: dump
    source:
      - on amd64: https://github.com/Open-Wine-Components/umu-launcher/releases/download/$SNAPCRAFT_PROJECT_VERSION/python3-umu-launcher_$SNAPCRAFT_PROJECT_VERSION-1_amd64_ubuntu-resolute.deb
      - on arm64: https://github.com/Open-Wine-Components/umu-launcher/releases/download/$SNAPCRAFT_PROJECT_VERSION/python3-umu-launcher_$SNAPCRAFT_PROJECT_VERSION-1_arm64_ubuntu-resolute.deb

  umu-run-dependencies:
    after: [umu-run-app]
    plugin: nil
    stage-packages: [python3-xlib]
    prime: [usr/lib/python3/dist-packages]

  uddc-dependencies:
    after: [umu-run-dependencies]
    plugin: nil
    stage-packages: [yad, icoutils]
    prime:
      - -usr/bin/bwrap

  proot-next:
    after: [uddc-dependencies]
    plugin: nil
    build-packages: [curl]
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      curl -fsSL -o "$CRAFT_PART_INSTALL/bin/proot" \
        "https://github.com/selkies-project/proot-next/releases/download/0.3.9/proot-$(uname -m)"
      chmod +x "$CRAFT_PART_INSTALL/bin/proot"
      ln -sf proot "$CRAFT_PART_INSTALL/bin/bwrap"

  other-files:
    after: [proot-next]
    plugin: dump
    source: ./other-files
    organize:
      uddc: usr/bin/uddc
